name: Deploy to DomaiNesia cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy Frontend & Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js (For Frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package.json
        
    - name: 🔨 Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        
    - name: 📂 Sync Frontend to public_html (FTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./frontend/build/
        server-dir: ./public_html/
        # Ubah server-dir jika Anda tidak meng-host di root domain

    - name: 📂 Sync Backend to cPanel Application Folder (FTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: ./backend/ 
        # Sesuaikan dengan nama folder Setup Python App di cPanel
        
    # Opsional: Restart app python secara otomatis jika didukung oleh cPanel touch restart.txt
    # Anda perlu SSH action jika ingin restart otomatis secara advanced, 
    # namun secara default mengubah file .py kadang sudah men-trigger passenger restart.
